[workspace]
resolver = "3"
members = ["src-tauri", "crates/gicio-core"]
# `cargo run` in the repository root starts the app.
default-members = ["src-tauri", "crates/gicio-core"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros", "fs"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
